<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>Инвестиции</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/solarized.css" id="theme">
		
		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css" id="highlight-theme">

		<!-- Задания по стилю презентации номер (1) -->
		<style>
			.reveal-viewport {
				background: #01ebb87e !important;
			}
			
			/* 2. Стили для заголовков h2 */
			.section-header {
				background-color: #1e3a8a !important;
				color: #ffffff !important;
				padding: 10px 20px;
				border-radius: 8px;
			}

			/* 3. Стили для заголовка h1 (наоборот по цветам) */
			.title-header {
				background-color: #ffffff !important;
				color: #1e3a8a !important;
				padding: 15px 30px;
				border: 3px solid #1e3a8a;
				border-radius: 8px;
				display: inline-block;
			}
		</style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section> 
					<!-- Добавлен класс title-header -->
					<h1 class="title-header">Инвестиции</h1> 
				</section>
				<section> 
					<!-- Добавлен класс section-header -->
					<h2 class="section-header">Определения</h2> 
				</section>
				<section data-markdown="Economy/invest.md"></section>
				<section data-markdown="Economy/treding.md"></section>
				<section data-markdown="Economy/market.md"></section>
				<section data-markdown="Economy/exchange.md"></section>
				<section data-markdown="Economy/security_paper.md"></section>
				<section data-markdown="Economy/investment_portfolio.md"></section>
				<section data-markdown="Economy/bull.md"></section>
				<section data-markdown="Economy/bear.md"></section>
				<section data-markdown="Economy/flat.md"></section>
				<section data-markdown="Economy/bull_and_bear.md"></section>
				<section data-markdown="Economy/spread.md"></section>
				<section data-markdown="Economy/diversification.md"></section>
				<section data-markdown="Economy/line.md"></section>				
				<section> 
					<!-- Добавлен класс section-header -->
					<h2 class="section-header">Доходность портфель</h2> 
				</section>
				<section data-markdown="Economy/rate_of_return.md"></section>
				
				<!-- Изолируем iframe от Markdown -->
				<section data-fullscreen data-menu-title="Расчет доходность"> 
					<iframe src="html/rate_of_return.html" frameborder="0" class="stretch"></iframe>
				</section>
				
				<section> 
					<!-- Добавлен класс section-header -->
					<h2 class="section-header">График инвестиции</h2> 
				</section>
				<section data-markdown="Economy/line.md"></section>
				
				<!-- Изолируем iframe от Markdown -->
				<section data-fullscreen data-menu-title="Линеный график"> 
					<iframe src="html/line.html" frameborder="0" class="stretch"></iframe>
				</section>
				
				<section data-markdown="Economy/candlestick.md"></section>
				
				<!-- Изолируем iframe от Markdown -->
				<section data-fullscreen data-menu-title="Линеный график"> 
					<iframe src="html/line.html" frameborder="0" class="stretch"></iframe>
				</section>
                <section>
                    <div style="position: relative; width: 100%; height: 100%;">
                        <!-- Картинка растягивается на весь слайд -->
                        <img src="img/funny_cat.jpg" alt="Кот-капиталист" class="r-stretch" style="width: 100%; height: auto; display: block;">
                        
                        <!-- Текст поверх картинки -->
                        <!-- Добавлен класс section-header -->
                        <h2 class="section-header" style="position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: auto; margin: 0; box-shadow: 2px 2px 8px rgba(0,0,0,0.5);">
                            Капиталюги
                        </h2>
                    </div>
                </section>
                
                <!-- СЛАЙД С СОБАКОЙ (Исправлена высота контейнера на 100%) -->
                <section>
                    <div style="position: relative; width: 100%; height: 100%;">
                        <img src="img/funny_dog.jpg" alt="Смешная собака" class="r-stretch" style="width: 100%; height: auto; display: block;">
                        
                        <!-- Добавлен класс section-header -->
                        <h2 class="section-header" style="position: absolute; top: 10%; left: 50%; transform: translateX(-50%); width: auto; margin: 0; box-shadow: 2px 2px 8px rgba(0,0,0,0.5);">
                            Беееееее
                        </h2>
                    </div>
                </section>
                
                <!-- ФИНАЛЬНЫЙ СЛАЙД (Красиво оформлен заголовок) -->
				<section>
					<h1 class="title-header">Спасибо за внимание!</h1>
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>

			Reveal.initialize({
				hash: true,
				markdown: {
					smartypants: true
				},
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});
		</script>
	</body>
</html>
