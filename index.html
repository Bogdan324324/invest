<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инвестиции</title>
    
    <!-- Основные стили Reveal.js -->
    <link rel=" “stylesheet” href="./plugin/reveal/reveal.css">
    <link rel="stylesheet" href="./plugin/reveal/theme/black.css">
    <link rel="stylesheet" href="./plugin/reveal/plugin/highlight/monokai.css">
    <link rel="stylesheet" href="./plugin/menu/menu.css">
    
    <!-- Наша тема -->
    <link rel="stylesheet" href="./css/theme.css">
    
    <!-- KaTeX для формул -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
    <div class="reveal">
        <div class="slides">
            <section data-markdown="./slides/slide01.md"></section>
            <section data-markdown="./slides/slide02.md"></section>
            <section data-markdown="./slides/slide03.md"></section>
            <section data-markdown="./slides/slide04.md"></section>
            <section data-markdown="./slides/slide05.md"></section>
            <section data-markdown="./slides/slide06.md"></section>
            <section data-markdown="./slides/slide07.md"></section>
            <section data-markdown="./slides/slide08.md"></section>
            <section data-markdown="./slides/slide09.md"></section>
            <section data-markdown="./slides/slide10.md"></section>
            <section data-markdown="./slides/slide11.md"></section>
            <section data-markdown="./slides/slide12.md"></section>
            <section data-markdown="./slides/slide13.md"></section>
            <section data-markdown="./slides/slide14.md"></section>
            <section data-markdown="./slides/slide15.md"></section>
            <section data-markdown="./slides/slide16.md"></section>
        </div>
    </div>

    <!-- Скрипты Reveal.js -->
    <script src="./plugin/reveal/reveal.js"></script>
    <script src="./plugin/reveal/plugin/markdown.js"></script>
    <script src="./plugin/reveal/plugin/highlight.js"></script>
    <script src="./plugin/menu/menu.js"></script>
    
    <!-- KaTeX -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <script>
        Reveal.initialize({
            hash: true,
            slideNumber: true,
            controls: true,
            progress: true,
            center: true,
            transition: 'slide',
            plugins: [ RevealMarkdown, RevealHighlight, RevealMenu ],
            menu: {
                useTextContentForMissingTitles: true,
                markers: true,
                loadIcons: false
            }
        });
        
        function renderFormulas(element) {
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            renderFormulas(document.body);
        });
        
        Reveal.on('slidechanged', event => {
            renderFormulas(event.currentSlide);
        });
    </script>
</body>
</html>
