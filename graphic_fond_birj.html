<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        html, body, #container {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <!-- Подключение библиотек AnyChart -->
    <script src="../charts/anychart-core.min.js"></script>
    <script src="../charts/anychart-stock.min.js"></script>
    <script src="../charts/anychart-data-adapter.min.js"></script>

    <script>
        anychart.onDocumentReady(function () {
            anychart.data.loadCsvFile("moex.csv", function (data) {
                var chart = anychart.stock();
                chart.title("График акций Московской биржи");    
                
                // Добавляем данные на график
                chart.container("container");
                chart.draw();
                
                var dataTable = anychart.data.table(0, 'MMM d, yyy');
                dataTable.addData(data);
                
                var mapping = dataTable.mapAs({
                    'open' : 1,
                    'high' : 2,
                    'low' : 3,
                    'close' : 4,
                });
                
                var series = chart.plot(0).candlestick(mapping);
                series.fallingFill('red');
                series.risingFill('green');
                series.risingStroke('black');
                series.fallingStroke('black');
            });
        });
    </script>
</body>
</html>
