<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дневник</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4" style="max-width: 700px;">
    <div class="card p-4">
        <h2 class="text-center mb-4">✦ Дневник ✦</h2>

        <div class="mb-3">
            <label class="form-label">Фамилия, Имя, Отчество</label>
            <input type="text" class="form-control" id="fio" value="Трищилов Богдан Алексеевич">
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Пол</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="male" value="Мужской" checked>
                        <label class="form-check-label" for="male">Мужской</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="female" value="Женский">
                        <label class="form-check-label" for="female">Женский</label>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label">Школа</label>
                <input type="text" class="form-control" id="school" value="101">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Населенный Пункт</label>
                <input type="text" class="form-control" id="city" value="Ижевск">
            </div>
            <div class="col-md-6">
                <label class="form-label">Цвет Обложки</label>
                <input type="color" class="form-control form-control-color" id="color" value="#cac7e1">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Год Начала Обучения</label>
                <input type="text" class="form-control" id="year" value="2012">
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" value="email.com4r34@43r.ru">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Телефон</label>
            <input type="tel" class="form-control" id="phone" value="+79999999999">
        </div>

        <div class="text-center">
            <button type="button" class="btn btn-success btn-lg" onclick="createCover()">
                ✦ Создать Обложку ✦
            </button>
        </div>
    </div>
</div>

<script>
function createCover() {
    var fio = document.getElementById('fio').value;
    var gender = document.querySelector('input[name="gender"]:checked').value;
    var school = document.getElementById('school').value;
    var city = document.getElementById('city').value;
    var color = document.getElementById('color').value;
    var year = document.getElementById('year').value;
    var email = document.getElementById('email').value;
    var phone = document.getElementById('phone').value;

    var newWindow = window.open('', 'CoverWindow', 'width=400,height=600');

    if (!newWindow) {
        alert('Разрешите всплывающие окна в браузере!');
        return;
    }

    var coverHTML = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Обложка</title>' +
        '<style>body{background-color:' + color + ';font-family:Arial,sans-serif;margin:0;padding:30px;' +
        'height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;' +
        'justify-content:center;text-align:center;border:10px double #333;}' +
        'h1{font-size:36px;margin-bottom:10px;}.school{font-size:20px;margin-bottom:30px;}' +
        '.name{font-size:24px;font-weight:bold;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:30px;}' +
        '.info{font-size:16px;line-height:1.8;}</style></head><body>' +
        '<h1>ДНЕВНИК</h1>' +
        '<div class="school">Школа № ' + school + '</div>' +
        '<div class="name">' + fio + '</div>' +
        '<div class="info">г. ' + city + '<br>' + year + ' учебный год<br>' + gender + '<br><br>' +
        'Тел: ' + phone + '<br>Email: ' + email + '</div>' +
        '</body></html>';

    newWindow.document.write(coverHTML);
    newWindow.document.close();
}
</script>

</body>
</html>
