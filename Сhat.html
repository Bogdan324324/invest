<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пиу пиу чат</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <div id="chat"></div>

    <form onsubmit="send(event)" class="controls">
        <input type="text" id="input" placeholder="Напишите сообщение..." required>
        <button>Отправить</button>
    </form>

<script>
    const send = (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        chat.insertAdjacentHTML('beforeend', `<div>${text}</div>`);
        input.value = "";
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: 'smooth'
        })
    };
</script>
</body>
</html>
