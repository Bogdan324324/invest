<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агния Барто — Мячик</title>
    <style>
        /* Стилизация заголовка */
        .poem-title {
            color: #2c3e50;
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 1px;
            position: relative;
        }

        /* Стилизация текста стихотворения */
        .poem-text {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #34495e;
            margin-bottom: 30px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="poem-card">
        <h2 class="poem-title">Мячик</h2>
        
        <p class="poem-text">
            <b>Наша Таня громко плачет:</b><br>
            <i>Уронила в речку мячик.</i><br>
            -Тише, Танечка, не плачь:<br>
            <strike>Не утонет в речке мяч.</strike><br>
        </p>
        
        <p class="poem-author"><b><i>Автор: А. Л. Барто</i></b></p>
    </div>

</body>
</html>
