<table border=1 id=t></table>
<script>
const data = [
  ['Иванов И.И.', '1980-05-15', 'м', 100000],
  ['Петрова М.А.', '1990-08-20', 'ж', 80000],
  ['Сидоров П.С.', '1975-12-01', 'м', 120000],
  ['Козлова А.В.', '1985-03-10', 'ж', 90000],
  ['Морозов Д.А.', '1995-07-25', 'м', 75000]
];

const age = d => {
  const b = new Date(d), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a;
};

const fmt = n => n.toLocaleString('ru-RU');
const headers = ['№','ФИО','ДР','Возраст','Гросс','Нет','Декабрь','Новая з/п','Годовой доход','Вычет','До пенсии'];
let html = '<tr>' + headers.map(h => '<th>' + h).join('');

data.forEach((r, i) => {
  const [fio, dr, sex, gross] = r;
  const net = Math.round(gross * 0.87);
  const dec = net * 3;
  const next = Math.round(gross * 1.05);
  const year = net * 11 + dec;
  const tax = gross - net;
  const pen = (sex === 'м' ? 65 : 60) - age(dr);
  html += `<tr><td>${i+1}<td>${fio}<td>${dr.split('-').reverse().join('.')}<td>${age(dr)}<td>${fmt(gross)}<td>${fmt(net)}<td>${fmt(dec)}<td>${fmt(next)}<td>${fmt(year)}<td>${fmt(tax)}<td>${pen} лет`;
});

document.getElementById('t').innerHTML = html;
</script>
